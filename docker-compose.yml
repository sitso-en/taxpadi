services:
  postgres:
    image: postgres:15
    container_name: taxpadi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxpadi_db}
      POSTGRES_USER: ${POSTGRES_USER:-taxpadi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxpadi_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taxpadi_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: