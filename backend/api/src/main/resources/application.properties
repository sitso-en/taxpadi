spring.application.name=api
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

#Database 
#PostgreSQL running via Docker Compose on port 5434
#To connect manually: psql -h localhost -p 5434 -U taxpadi_user -d taxpadi_db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/taxpadi_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taxpadi_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taxpadi_password}
spring.datasource.driver-class-name=org.postgresql.Driver

#Validates schema matches JPA entities on startup — does not alter DB
spring.jpa.hibernate.ddl-auto=validate

#Flyway — runs migrations from db/migration on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#Redis 
#Redis running via Docker Compose (used for caching)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

#SMS (Wigal Frog)
wigal.api-key=${WIGAL_API_KEY:}
wigal.username=${WIGAL_USERNAME:}
wigal.sender-id=TaxPadi

#JWT
#Secret for signing access tokens (15 min expiry) — Base64 encoded
jwt.secret=${JWT_SECRET:Yb+tH5o7rUuYBlEPoCx3fiH4AmoXe10FCi2XzesjhvfEVRhOWvaAfII1SvQgZz41rBlXCbLmwWRIcZlWkOV2CA==}
# Separate secret for signing password reset tokens (15 min, single-use) — Base64 encoded
