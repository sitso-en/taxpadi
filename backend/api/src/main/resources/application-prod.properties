#Production overrides — all secrets must be set as environment variables

#Database (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#Flyway manages the schema — Hibernate must not validate or alter it
spring.jpa.hibernate.ddl-auto=none

#Redis (Upstash)
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

#JWT — no fallback defaults in prod
jwt.secret=${JWT_SECRET}
jwt.reset-secret=${JWT_RESET_SECRET}

#Logging
logging.level.root=WARN
logging.level.com.taxpadi=INFO
logging.level.org.springframework.security=WARN

#Swagger — disable in prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

#App
app.base-url=${APP_BASE_URL}

#Paystack
paystack.secret-key=${PAYSTACK_SECRET_KEY}
