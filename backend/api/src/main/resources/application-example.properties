spring.application.name=api

# Database Configuration
# Connect manually: psql -h localhost -p 5434 -U username -d taxpadi_db
spring.datasource.url=jdbc:postgresql://localhost:5434/taxpadi_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Arkesel SMS Configuration
arkesel.api.key=your_arkesel_api_key
arkesel.sms.sender=TaxPadi

# JWT Configuration - generate with: openssl rand -base64 32(Yes it ends with =)
jwt.secret=your_base64_encoded_secret_key
jwt.reset-secret=your_base64_encoded_secret_key

#Logging
logging.level.org.springframework.security=DEBUG


spring.jackson.property-naming-strategy=SNAKE_CASE


sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=sitso.nkrumah@gmail.com
sendgrid.from-name=TaxPadi

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Anthropic (TaxBot + OCR)
anthropic.api-key=${ANTHROPIC_API_KEY}

# AssemblyAI (voice transactions)
assemblyai.api-key=${ASSEMBLYAI_API_KEY}

# Paystack (payments)
paystack.secret-key=${PAYSTACK_SECRET_KEY}
