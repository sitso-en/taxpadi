# Test-only configuration. Lives on the test classpath, so it is never packaged
# into the jar and can never affect production.

# The real schema is managed by hand in Neon — Flyway is not part of the workflow,
# so nothing would create tables in a throwaway test database. Let Hibernate build
# them from the entities for the duration of the run, then drop them.
# Overrides the "validate" in the main application.properties for tests only.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Signing keys for tests. Not secrets: they decode to
# "ci-only-...-not-a-secret-do-not-use-in-production" and only ever sign tokens
# inside a disposable test database. Real keys come from the environment.
